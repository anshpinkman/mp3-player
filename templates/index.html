<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="glow" id="glow"></div>
<main class="app">

  <section class="player">
    <div class="cover" id="cover">
      <img id="coverImg" alt="" hidden>
      <svg class="ph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </div>

    <div class="meta">
      <h1 id="title">Nothing playing</h1>
      <p id="artist">Pick a song from the list</p>
      <p id="album"></p>
    </div>

    <div class="seek">
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>

    <div class="controls">
      <button id="shuffle" class="ghost" title="Shuffle (S)" aria-label="Shuffle">
        <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      </button>
      <button id="prev" class="ghost" title="Previous (Shift+←)" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button id="play" class="main" title="Play / pause (Space)" aria-label="Play">
        <svg id="iPlay" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iPause" viewBox="0 0 24 24" fill="currentColor" stroke="none" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <button id="next" class="ghost" title="Next (Shift+→)" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </button>
      <button id="repeat" class="ghost" title="Repeat (R)" aria-label="Repeat">
        <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg>
        <i id="rep1" hidden>1</i>
      </button>
    </div>

    <div class="volume">
      <button id="mute" class="ghost" title="Mute (M)" aria-label="Mute">
        <svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      </button>
      <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume">
    </div>
  </section>

  <section class="list">
    <div class="bar">
      <input type="search" id="q" placeholder="Search songs, artists or albums">
      <select id="playlistSelect" aria-label="Playlist" style="max-width:145px;background:#111;color:#eee;border:1px solid #292929;border-radius:10px;padding:10px"></select>
      <button id="newPlaylist" class="add" type="button" title="Create playlist" aria-label="Create playlist" style="font-size:22px">☷</button>
      <button id="showFavs" class="add" type="button" title="Show favourites" aria-label="Show favourites" style="font-size:18px">♡</button>
      <label class="add" title="Add MP3 files">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <input type="file" id="file" accept=".mp3,audio/mpeg" multiple hidden>
      </label>
    </div>
    <ul id="tracks"></ul>
    <p id="status" class="empty" role="status" aria-live="polite" hidden></p>
    <p class="empty" id="empty" hidden>No songs yet. Drop MP3 files here or press +</p>
  </section>
</main>

<div class="drop" id="drop">Drop MP3 files to add them</div>
<audio id="audio" preload="metadata"></audio>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
